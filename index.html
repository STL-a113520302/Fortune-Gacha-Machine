<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運勢扭蛋機：抽取專屬建議</title>
<style>
:root{--ink:#76515f;--muted:#a1848c;--pink:#e991aa;--pink-deep:#d97594;--mint:#a9dcc9;--cream:#fff8f0;--line:#f0dfdf;--gold:#e6bd68;--shadow:0 18px 50px rgba(147,103,117,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
body{background:radial-gradient(ellipse at 12% 12%,#ffe5ed 0,transparent 34%),radial-gradient(ellipse at 92% 90%,#e1f4eb 0,transparent 35%),#fffaf5;overflow:hidden}
button{font:inherit}
.app{height:100dvh;min-height:580px;padding:24px;display:flex;flex-direction:column;max-width:1600px;margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:.08em}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#ffe4ec;color:#cf7893;font-size:19px;box-shadow:inset 0 -3px #f6cbd7}
.top-note{font-size:12px;color:var(--muted);background:#fff9;padding:8px 13px;border:1px solid #f4e5e3;border-radius:999px}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px, .82fr) minmax(440px,1.18fr);gap:20px}
.panel{min-height:0;border:1px solid rgba(240,220,222,.9);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.left{background:linear-gradient(155deg,#fff0f4,#fff8f2 68%,#f8fff9);padding:clamp(22px,3vw,42px);display:flex;flex-direction:column;align-items:center;position:relative}
.left:before,.left:after{content:"✦";position:absolute;color:#f0c8a0;opacity:.7;font-size:24px}
.left:before{top:18%;left:9%}.left:after{right:9%;top:31%;font-size:18px}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:#bd8c98;margin:2px 0 12px;text-align:center}
h1{font-size:clamp(25px,2.7vw,39px);line-height:1.3;margin:0;text-align:center;letter-spacing:.03em;color:#795362}
h1 span{display:block;color:#d97f9b}
.lead{font-size:14px;color:#a1848c;margin:12px 0 4px;text-align:center;line-height:1.8}
.machine-wrap{position:relative;flex:1;min-height:180px;width:100%;display:flex;align-items:center;justify-content:center}
.machine{height:min(43vh,410px);max-width:100%;width:auto;object-fit:contain;filter:drop-shadow(0 13px 15px rgba(191,128,149,.12));position:relative;z-index:1;transform-origin:50% 78%}
.machine.shake{animation:shake .62s ease-in-out}
.spark{position:absolute;font-size:22px;color:#eac36f;animation:twinkle 2.3s ease-in-out infinite}
.spark.s1{left:15%;top:26%}.spark.s2{right:14%;bottom:24%;animation-delay:.7s}.spark.s3{right:22%;top:15%;font-size:15px;animation-delay:1.2s}
.primary{border:0;border-radius:999px;padding:15px 24px;background:linear-gradient(135deg,#ef9fb5,#df819f);color:#fff;font-weight:800;letter-spacing:.04em;box-shadow:0 7px 0 #cf718f,0 12px 24px #e9a4b8aa;cursor:pointer;transition:transform .18s,box-shadow .18s;width:min(100%,290px);position:relative;z-index:2}
.primary:hover{transform:translateY(-2px);box-shadow:0 9px 0 #cf718f,0 15px 27px #e9a4b8aa}
.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #cf718f}
.primary:disabled{opacity:.65;cursor:wait;transform:none}
.helper{font-size:12px;color:#ad929a;text-align:center;margin:17px 0 0}
.right{background:rgba(255,255,255,.82);padding:clamp(20px,3vw,38px);display:flex;flex-direction:column;position:relative}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.result-kicker{font-size:11px;letter-spacing:.16em;font-weight:800;color:#c09a76}
.pill{border-radius:999px;padding:7px 11px;background:#fff6e8;color:#b89455;font-size:11px;font-weight:700;white-space:nowrap}
.result-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 4px}
.empty-art{width:min(40%,220px);min-width:135px;aspect-ratio:1;position:relative;display:grid;place-items:center;margin-bottom:20px}
.empty-orbit{position:absolute;inset:5%;border:1px dashed #eed6d8;border-radius:50%;animation:spin 25s linear infinite}
.empty-capsule{width:88px;height:112px;border-radius:50px;background:linear-gradient(135deg,#ffdbe5 0 48%,#bde8d8 49%);border:5px solid #fff;box-shadow:0 10px 25px #d5a4b566;transform:rotate(-13deg);position:relative}
.empty-capsule:before{content:"";position:absolute;left:-5px;right:-5px;top:48%;height:8px;background:#fff;border-radius:8px}
.empty-capsule:after{content:"✦";position:absolute;top:20px;left:29px;color:#fff;font-size:23px}
.empty-star{position:absolute;color:#e7bd6b;font-size:24px}
.empty-star.a{top:6%;right:4%}.empty-star.b{bottom:9%;left:3%;font-size:17px}
.stage-title{font-size:clamp(22px,2.3vw,31px);margin:0;color:#805c66;line-height:1.4}
.stage-copy{font-size:14px;color:#a18a8d;line-height:1.9;max-width:390px;margin:10px auto 0}
.result-card{display:none;width:min(100%,510px);border-radius:25px;padding:clamp(18px,3vh,28px);background:var(--card-bg,#fff2f5);border:1px solid var(--card-line,#f6d9e2);box-shadow:0 12px 35px rgba(145,104,115,.09);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
.result-card.show{display:block}
.mascot{font-size:clamp(45px,7vh,70px);line-height:1.1;filter:drop-shadow(0 4px 2px #b89b6b22);margin-bottom:9px}
.result-label{font-size:12px;letter-spacing:.18em;color:var(--card-ink,#b56c83);font-weight:800}
.fortune-name{font-size:clamp(38px,5.5vh,58px);line-height:1.2;margin:6px 0 7px;color:var(--card-ink,#b56c83);font-weight:900;letter-spacing:.08em}
.fortune-slogan{font-size:16px;font-weight:800;color:#7d5b65;margin:0 0 19px}
.quote-box{background:#ffffffb8;border:1px solid #ffffffc9;border-radius:17px;padding:17px 18px;text-align:left}
.quote-title{font-size:12px;font-weight:800;color:var(--card-ink,#b56c83);margin:0 0 8px}
.quote-text{font-size:15px;line-height:1.9;color:#755b62;margin:0}
.result-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;font-size:11px;color:#a58b91}
.again{border:1px solid #efc7d2;background:#fff;color:#c87591;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;cursor:pointer}
.again:hover{background:#fff1f5}
.falling-capsule{display:none;width:56px;height:70px;border-radius:50px;background:linear-gradient(135deg,#ffdbe5 0 48%,#bde8d8 49%);border:4px solid white;box-shadow:0 8px 20px #d5a4b566;position:absolute;top:28%;z-index:3}
.falling-capsule:after{content:"";position:absolute;left:-4px;right:-4px;top:47%;height:6px;background:#fff}
.result-stage.busy .falling-capsule{display:block;animation:drop .75s cubic-bezier(.2,.75,.3,1) both}
.result-stage.busy .empty-art{opacity:.2;transform:scale(.92)}
.result-stage.busy .stage-title,.result-stage.busy .stage-copy{opacity:.45}
.footer{display:flex;justify-content:space-between;gap:12px;padding:13px 8px 0;color:#b29a9c;font-size:11px}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-5deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}75%{transform:rotate(-1deg)}}
@keyframes drop{0%{transform:translateY(-100px) rotate(-25deg) scale(.8);opacity:0}25%{opacity:1}75%{transform:translateY(105px) rotate(18deg) scale(1.04)}100%{transform:translateY(80px) rotate(0) scale(.95);opacity:0}}
@keyframes cardIn{0%{opacity:0;transform:translateY(18px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes twinkle{0%,100%{transform:scale(.85) rotate(-8deg);opacity:.55}50%{transform:scale(1.15) rotate(8deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){
 body{overflow:auto}
 .app{height:auto;min-height:100dvh;padding:14px}
 .layout{grid-template-columns:1fr;gap:14px}
 .left{min-height:0;padding:24px 22px 22px}
 .right{min-height:520px}
 .machine-wrap{flex:none;height:clamp(220px,34vh,290px);min-height:0;margin:8px 0 12px}
 .machine{height:100%;max-height:100%;width:auto;max-width:88%;object-fit:contain}
 h1{font-size:clamp(26px,5.2vw,36px)}
 .lead{margin:10px 0 0}
 .primary{flex:none}
 .helper{margin-top:14px}
 .top-note{display:none}
 .footer{padding-bottom:6px}
}
@media(max-width:480px){
 .app{padding:10px}
 .left{padding:22px 16px 20px}
 .machine-wrap{height:230px}
 h1{font-size:27px}
 .lead{font-size:13px}
 .right{padding:22px 16px;min-height:500px}
}
@media(max-height:720px) and (min-width:901px){.app{padding:14px}.topbar{padding-bottom:10px}.left{padding:20px}.right{padding:20px}.machine{height:min(39vh,310px)}.lead{margin-top:7px}.helper{margin-top:10px}.result-card{padding:15px}.mascot{font-size:42px}.fortune-name{font-size:42px}.quote-box{padding:12px 14px}}
/* Desktop browser-window fit: keep heading, machine, button and helper text in separate space. */
@media(min-width:901px) and (max-height:850px){
 .app{padding:14px 20px 10px}
 .topbar{padding-bottom:10px}
 .left{padding:clamp(16px,2.1vh,28px) clamp(18px,2vw,30px)}
 .eyebrow{margin:0 0 7px;font-size:10px}
 h1{font-size:clamp(24px,2.15vw,32px);line-height:1.22}
 .lead{font-size:12px;margin:7px 0 0;line-height:1.5}
 .machine-wrap{flex:1;min-height:100px;margin:2px 0 6px}
 .machine{height:min(39vh,335px);max-height:100%}
 .primary{padding:12px 20px}
 .helper{margin-top:11px;font-size:11px}
 .footer{padding-top:8px}
}
@media(min-width:901px) and (max-height:720px){
 .app{padding:8px 16px 6px}
 .topbar{padding-bottom:7px}
 .brand-mark{width:29px;height:29px}
 .layout{gap:14px}
 .left{padding:12px 20px}
 .eyebrow{margin-bottom:4px}
 h1{font-size:clamp(22px,1.9vw,28px)}
 .lead{margin-top:4px;font-size:11px}
 .machine-wrap{min-height:80px;margin:0 0 3px}
 .machine{height:min(32vh,245px)}
 .primary{padding:10px 18px;font-size:14px}
 .helper{margin-top:8px;font-size:10px}
 .footer{padding-top:5px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>

    </section>
    <section class="panel right" aria-live="polite" aria-label="今日運勢結果">
      <div class="result-head">
        <span class="result-kicker">YOUR FORTUNE</span>
        <span class="pill" id="resultPill">✧ 等待好運降臨</span>
      </div>
      <div class="result-stage" id="resultStage">
        <div class="falling-capsule" aria-hidden="true"></div>
        <div class="empty-art" id="emptyArt">
          <div class="empty-orbit"></div><div class="empty-capsule"></div>
          <span class="empty-star a">✦</span><span class="empty-star b">✧</span>
        </div>
        <h2 class="stage-title" id="stageTitle">你的今日運勢，準備揭曉</h2>
        <p class="stage-copy" id="stageCopy">按下左側的按鈕，讓一顆幸運扭蛋替今天帶來一點驚喜。</p>
        <article class="result-card" id="resultCard">
          <div class="mascot" id="mascot">⭐</div>
          <div class="result-label">TODAY'S FORTUNE</div>
          <div class="fortune-name" id="fortuneName">大吉</div>
          <p class="fortune-slogan" id="fortuneSlogan">今天，放心去發光。</p>
          <div class="quote-box">
            <p class="quote-title">♡ 給你的一句話</p>
            <p class="quote-text" id="quoteText"></p>
          </div>
          <div class="result-bottom"><span id="resultSub">這是屬於你的此刻提醒</span><button class="again" id="againBtn">↻ 再抽一次</button></div>
        </article>
      </div>
    </section>
  </main>
  <footer class="footer"><span>♡ 把今天過成自己的小小奇蹟</span><span>運勢僅供娛樂與自我鼓勵</span></footer>
</div>
<script>
const fortunes = [
 {name:"大吉",weight:10,emoji:"⭐",slogan:"今天，放心去發光。",bg:"#fff3d9",line:"#f3dca7",ink:"#a67b31",quotes:[
 "你不需要刻意證明自己，也能讓人看見你的好。",
 "你曾經付出的努力，正在為未來累積更多可能。",
 "如果有一件事讓你心動，不妨勇敢跨出第一步。",
 "今天適合相信自己的判斷，別因為害怕失敗而錯過機會。",
 "小小的幸運也值得珍惜，記得好好享受今天。",
 "你比想像中更有能力，試著給自己多一點信心。",
 "把握眼前的好時機，也別忘了肯定一路努力的自己。",
 "願你今天遇見好事，也有勇氣接住屬於你的驚喜。"]},
 {name:"中吉",weight:20,emoji:"🍀",slogan:"好事正在慢慢靠近。",bg:"#e8f7ed",line:"#c4e6d0",ink:"#4f9471",quotes:[
 "好事不一定突然降臨，有時候是你一步一步走近它。",
 "不用急著追上別人的進度，你有自己的節奏。",
 "今天只要比昨天多前進一點點，就已經很棒了。",
 "把眼前的事情做好，未來自然會慢慢清晰。",
 "遇到不確定的事時，先做好能掌握的部分。",
 "你的努力也許還沒被看見，但不代表它沒有意義。",
 "給自己一點時間，成長往往發生在不知不覺之間。",
 "保持期待，也記得享受正在前進的每一天。"]},
 {name:"吉",weight:40,emoji:"☀️",slogan:"平凡的一天，也值得期待。",bg:"#eaf5ff",line:"#cbdff6",ink:"#5b8fc4",quotes:[
 "不必每一天都很精彩，平安順心也是一種幸福。",
 "今天記得好好吃飯、好好休息，你自己也很重要。",
 "一杯喜歡的飲料、一首好聽的歌，都能成為今天的小確幸。",
 "不用把所有事情做到滿分，你已經很努力了。",
 "允許自己偶爾放慢腳步，生活不需要一直衝刺。",
 "把注意力放回自己身上，你也值得被溫柔對待。",
 "平凡的日子也能藏著驚喜，記得留一點時間給快樂。",
 "今天不需要特別厲害，只要自在地做自己就很好。"]},
 {name:"兇",weight:15,emoji:"🌦️",slogan:"放慢腳步，仔細留意。",bg:"#fff0e5",line:"#f5d5bd",ink:"#bd8055",quotes:[
 "今天對自己多一點耐心，事情不必急著一次完成。",
 "遇到不順利的時候，先停一下，再決定下一步。",
 "仔細確認重要的小細節，能讓你更安心地前進。",
 "別讓一時的挫折，否定你過去所有的努力。",
 "如果感到煩躁，先休息一下，再重新整理思緒。",
 "不是每個問題都需要立刻解決，先處理最重要的事。",
 "今天記得保留一些時間給自己，不必答應所有人的要求。",
 "即使事情沒有照預期發展，你仍然可以找到新的方法。"]},
 {name:"大兇",weight:15,emoji:"🌙",slogan:"先照顧好自己。",bg:"#f2edff",line:"#ddd2f5",ink:"#8e79b8",quotes:[
 "今天先不用勉強自己發光，能好好照顧自己就很棒了。",
 "你不需要在一天之內解決所有問題，一步一步來就好。",
 "如果今天有點累，允許自己休息，明天再重新出發。",
 "一次不順利，不代表接下來都會如此。",
 "別急著責怪自己，先弄清楚發生了什麼，再慢慢處理。",
 "你可以暫時沒有答案，也可以安心地說自己需要時間。",
 "今天對自己溫柔一點，你值得被理解，也值得被善待。",
 "即使現在有些迷惘，你仍然擁有重新選擇方向的機會。"]}
];
const $ = id => document.getElementById(id);
const drawBtn = $("drawBtn"), againBtn = $("againBtn"), machine = $("machine");
const stage = $("resultStage"), card = $("resultCard");
let busy = false;
function pickWeighted(){
 const total = fortunes.reduce((sum,f)=>sum+f.weight,0);
 let roll = Math.random()*total;
 for(const f of fortunes){roll-=f.weight;if(roll<0)return f;}
 return fortunes[fortunes.length-1];
}
function chooseQuote(f){return f.quotes[Math.floor(Math.random()*f.quotes.length)];}
function draw(){
 if(busy)return;
 busy=true;drawBtn.disabled=true;againBtn.disabled=true;
 drawBtn.textContent="✧ 幸運扭蛋轉動中…";
 machine.classList.remove("shake");void machine.offsetWidth;machine.classList.add("shake");
 stage.classList.add("busy");card.classList.remove("show");
 $("resultPill").textContent="✧ 正在揭曉";
 $("stageTitle").textContent="幸運正在降落……";
 $("stageCopy").textContent="再等一下，看看今天會收到什麼鼓勵。";
 const f=pickWeighted(), quote=chooseQuote(f);
 window.setTimeout(()=>{
   stage.classList.remove("busy");
   $("emptyArt").style.display="none";
   $("stageTitle").style.display="none";$("stageCopy").style.display="none";
   card.style.setProperty("--card-bg",f.bg);card.style.setProperty("--card-line",f.line);card.style.setProperty("--card-ink",f.ink);
   $("mascot").textContent=f.emoji;$("fortuneName").textContent=f.name;$("fortuneSlogan").textContent=f.slogan;$("quoteText").textContent=quote;
   $("resultPill").textContent="✧ 今日抽中："+f.name;
   $("resultSub").textContent="每次抽取皆為獨立隨機結果";
   card.classList.add("show");
   drawBtn.disabled=false;againBtn.disabled=false;drawBtn.textContent="✦　再抽一次　✦";busy=false;
 },1050);
}
drawBtn.addEventListener("click",draw);againBtn.addEventListener("click",draw);
</script>
